  <rect x="106" y="92" width="300" height="348" rx="20" fill="none" stroke="#38D9F5" stroke-opacity="0.14" stroke-width="14"/>
  <rect x="106" y="92" width="300" height="348" rx="20" fill="#111B2B" stroke="#38D9F5" stroke-opacity="0.45" stroke-width="4"/>

  <!-- Corner brackets from the login card -->
  <g fill="none" stroke="#38D9F5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M106 132V112a20 20 0 0 1 20-20h20"/>
    <path d="M366 92h20a20 20 0 0 1 20 20v20"/>
    <path d="M406 400v20a20 20 0 0 1-20 20h-20"/>
    <path d="M146 440h-20a20 20 0 0 1-20-20v-20"/>
  </g>

  <!-- Clip -->
  <rect x="196" y="68" width="120" height="46" rx="12" fill="#38D9F5"/>
  <rect x="236" y="82" width="40" height="10" rx="5" fill="#080C14"/>

  <!-- Done tasks -->
  <rect x="146" y="150" width="56" height="56" rx="10" fill="#38D9F5"/>
  <path d="M160 179l10 11 19-23" fill="none" stroke="#080C14" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="226" y="169" width="140" height="18" rx="9" fill="#56748E"/>

  <rect x="146" y="240" width="56" height="56" rx="10" fill="#38D9F5"/>
  <path d="M160 269l10 11 19-23" fill="none" stroke="#080C14" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="226" y="259" width="108" height="18" rx="9" fill="#56748E"/>

  <!-- The task to do now -->
  <rect x="146" y="330" width="56" height="56" rx="10" fill="#7D2DFF"/>
  <path d="M178 335l-19 27h12l-4 21 21-29h-12z" fill="#FFFFFF"/>
  <rect x="226" y="349" width="140" height="18" rx="9" fill="#F3F6FC"/>
