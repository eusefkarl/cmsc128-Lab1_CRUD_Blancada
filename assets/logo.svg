<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">DO IT NOW! logo</title>

  <!-- App canvas -->
  <rect width="512" height="512" rx="112" fill="#080C14"/>

  <!-- Board, with a soft glow drawn as strokes so it survives icon converters -->
